name: Telemetron
description: >-
  Telemetron is an AI-powered customer support platform for hardware companies,
  backed by Y Combinator. It connects to IoT devices in real time, correlates
  device telemetry with customer records, diagnoses issues with AI, and
  resolves support tickets automatically. Its External API (ext-v1) lets
  hardware companies sync customers, devices, and ownership mappings into the
  platform, and an official hosted MCP server exposes org-scoped support tools
  (case lookup, customer search, device queries) to AI agents.
