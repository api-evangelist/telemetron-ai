openapi: 3.1.0
info:
  title: Telemetron External API (ext-v1)
  version: ext-v1
  description: >-
    RESTful API for syncing customer, device, and ownership-mapping data into
    Telemetron so it can correlate device telemetry with customers for
    AI-powered hardware support. Faithfully modeled from the published
    Telemetron API reference at https://docs.telemetron.ai/api-reference — every
    path, parameter, and response field below is transcribed from the docs; no
    fields were invented.
  contact:
    name: Telemetron Support
    email: support@telemetron.ai
    url: https://docs.telemetron.ai
  x-generated: '2026-07-21'
  x-method: generated
  x-source: https://docs.telemetron.ai/api-reference/introduction
servers:
  - url: https://admin.telemetron.ai/api/ext-v1
    description: Telemetron External API (production)
security:
  - apiKeyAuth: []
tags:
  - name: Customer
    description: Create, update, and query customer records.
  - name: Device
    description: Register and update devices; bulk-update device metadata.
  - name: Device Assignment
    description: Map devices to customers for telemetry routing.
  - name: Ticket
    description: Create support tickets.
paths:
  /customer/createOrUpdateCustomer:
    post:
      operationId: createOrUpdateCustomer
      tags: [Customer]
      summary: Create or update a customer
      description: >-
        Creates or updates customer records. Without telemetronCustomerId a new
        customer is created (409 if the email already exists); with
        telemetronCustomerId the matching customer is updated. Email is the
        unique identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  description: Customer's email address (unique identifier).
                name:
                  type: string
                  description: Full name (defaults to email prefix if omitted).
                phone:
                  type: string
                address:
                  type: string
                telemetronCustomerId:
                  type: string
                  description: Existing customer ID; when present the endpoint updates that customer.
            examples:
              create:
                value:
                  name: John Doe
                  email: john.doe@example.com
                  phone: "+1234567890"
                  address: 123 Main St, City, State 12345
      responses:
        '200':
          description: Customer created or updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  telemetronCustomerId: { type: string }
                  message: { type: string }
              examples:
                created:
                  value:
                    success: true
                    telemetronCustomerId: cust_a1b2c3d4e5f6
                    message: Customer created successfully
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
  /customer/queryCustomer:
    post:
      operationId: queryCustomer
      tags: [Customer]
      summary: Query a customer by email
      description: Retrieves customer information by email address. Response includes assigned devices.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Customer record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
  /customer/getCustomer/{telemetronCustomerId}:
    get:
      operationId: getCustomer
      tags: [Customer]
      summary: Get a customer by ID
      description: Retrieves customer information by Telemetron customer ID. Response includes assigned devices.
      parameters:
        - name: telemetronCustomerId
          in: path
          required: true
          schema: { type: string }
          description: The unique customer identifier.
      responses:
        '200':
          description: Customer record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
  /device:
    post:
      operationId: createOrUpdateDevice
      tags: [Device]
      summary: Create or update a device
      description: >-
        Creates a new device or updates an existing one by identifier. New
        devices require both identifier and type; existing devices can be
        updated by identifier plus any fields to change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              properties:
                identifier:
                  type: string
                  description: A unique, non-empty device identifier (serial, MAC, etc.).
                type:
                  type: string
                  description: Device type (e.g. sensor, gateway, controller). Required when creating.
                properties:
                  type: object
                  additionalProperties: true
                  description: Optional metadata object of additional device properties.
            examples:
              create:
                value:
                  identifier: sensor-001
                  type: sensor
                  properties: { location: Building A, firmware: v2.1.0, model: TM-500 }
      responses:
        '200':
          description: Device created or updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  deviceId: { type: string }
                  identifier: { type: string }
                  type: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
  /device/bulk-metadata:
    post:
      operationId: bulkUpdateDeviceMetadata
      tags: [Device]
      summary: Bulk-update device metadata
      description: >-
        Full-replacement update of deviceMetadata (properties) for up to 1,000
        existing devices in a single request, keyed by device identifier. Does
        not create devices; unrecognized identifiers are reported as not_found.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [devices]
              properties:
                devices:
                  type: object
                  minProperties: 1
                  maxProperties: 1000
                  additionalProperties:
                    type: object
                    additionalProperties: true
                  description: Map of device identifier to its new metadata object (full replacement).
      responses:
        '200':
          description: Bulk update result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  updated: { type: number }
                  notFound: { type: number }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        identifier: { type: string }
                        status: { type: string, enum: [updated, not_found] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
  /deviceAssignment/assignDeviceToOwners:
    post:
      operationId: assignDeviceToOwners
      tags: [Device Assignment]
      summary: Assign a device to one or more customers
      description: >-
        Assigns a device to one or more customers, creating the mapping used for
        telemetry correlation. Auto-creates customers if they don't exist;
        supports multi-owner (shared/family) devices; optionally auto-creates
        the device (requires deviceType).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceIdentifier, customerEmails]
              properties:
                deviceIdentifier: { type: string }
                customerEmails:
                  type: array
                  minItems: 1
                  items: { type: string, format: email }
                autoCreateDevice: { type: boolean, default: false }
                deviceType:
                  type: string
                  description: Required when autoCreateDevice is true.
            examples:
              assign:
                value:
                  deviceIdentifier: SN-12345-ABCDE
                  customerEmails: [john.doe@example.com]
                  autoCreateDevice: true
                  deviceType: Thermostat
      responses:
        '200':
          description: Device assigned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  deviceId: { type: string }
                  deviceWasCreated: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
  /deviceAssignment/assignDevicesToOwner:
    post:
      operationId: assignDevicesToOwner
      tags: [Device Assignment]
      summary: Assign multiple devices to a single customer
      description: >-
        Bulk variant that assigns multiple devices to one customer in a single
        call. Auto-creates the customer if needed; optionally auto-creates
        devices (requires deviceType). Reports which devices were newly
        assigned, already assigned, or skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerEmail, deviceIdentifiers]
              properties:
                customerEmail: { type: string, format: email }
                deviceIdentifiers:
                  type: array
                  minItems: 1
                  items: { type: string }
                autoCreateDevices: { type: boolean, default: false }
                deviceType:
                  type: string
                  description: Required when autoCreateDevices is true.
      responses:
        '200':
          description: Devices assigned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  customerId: { type: string }
                  customerWasCreated: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
  /deviceAssignment/unassignDeviceFromOwner:
    post:
      operationId: unassignDeviceFromOwner
      tags: [Device Assignment]
      summary: Unassign a device from a customer
      description: >-
        Removes the device-to-customer assignment. Both records remain; only the
        association is removed. Telemetry stops routing to that customer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceIdentifier, customerEmail]
              properties:
                deviceIdentifier: { type: string }
                customerEmail: { type: string, format: email }
      responses:
        '200':
          description: Device unassigned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  customerId: { type: string }
                  deviceIdentifier: { type: string }
                  devicesRemaining:
                    type: array
                    items: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
  /deviceAssignment/unassignDevicesFromOwner:
    post:
      operationId: unassignDevicesFromOwner
      tags: [Device Assignment]
      summary: Unassign multiple devices from a single customer
      description: >-
        Bulk variant removing multiple device-to-customer assignments in one
        request. Both device and customer records remain; only associations are
        removed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerEmail, deviceIdentifiers]
              properties:
                customerEmail: { type: string, format: email }
                deviceIdentifiers:
                  type: array
                  minItems: 1
                  items: { type: string }
      responses:
        '200':
          description: Devices unassigned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  customerId: { type: string }
                  unassignedDevices: { type: array, items: { type: string } }
                  skipped: { type: array, items: { type: string } }
                  devicesRemaining: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
  /ticket/createTicket:
    post:
      operationId: createTicket
      tags: [Ticket]
      summary: Create a support ticket
      description: >-
        Creates a support ticket. Requires either customerEmail or customerId;
        an unknown customerEmail auto-creates the customer. Tickets are
        auto-categorized and routed by the organization's rules.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  maxLength: 255
                description:
                  type: string
                priority:
                  type: string
                  enum: [low, medium, high, urgent]
                  default: medium
                customerEmail: { type: string, format: email }
                customerId: { type: string }
                category: { type: string }
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role: { type: string, enum: [customer, agent, bot] }
                      content: { type: string }
      responses:
        '200':
          description: Ticket created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: >-
        Per-organization API key issued from the Telemetron dashboard
        (Settings > Integrations). The same key authenticates the REST API and
        the MCP server (as an Authorization: Bearer token for MCP).
  schemas:
    Customer:
      type: object
      properties:
        id: { type: string, description: telemetronCustomerId }
        organizationId: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        address: { type: string }
        devices: { type: array, items: { type: string } }
        orders: { type: array, items: { type: string } }
        metadata: { type: object, additionalProperties: true }
    Error:
      type: object
      properties:
        error: { type: string, description: Human-readable error description. }
  responses:
    BadRequest:
      description: Bad request (invalid/missing parameters).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Unauthorized (invalid/missing API key).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflict (duplicate resource).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServerError:
      description: Server error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
